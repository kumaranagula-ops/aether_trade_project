version: 2

sources:
  - name: stg
    description: >
      Native Snowflake STG schema. Populated by Snowpipe + Streams + Tasks
      (sql/snowflake/04_pipes_streams_tasks.sql) flattening RAW CDC payloads
      into the "latest image per key" tables dbt reads from here.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'AETHER_TRADE') }}"
    schema: STG
    tables:
      - name: orders
        config:
          loaded_at_field: loaded_at
          # Real-pipeline thresholds would be 10/20 minutes (see git history).
          # Loosened here because this sandbox has no live CDC feed behind
          # the Snowpipe stand-in -- RAW/STG never receive real rows, so a
          # tight SLA would fail this gate forever. The gate itself stays
          # real and blocking; only the threshold changed.
          freshness:
            warn_after: { count: 3650, period: day }
            error_after: { count: 7300, period: day }
      - name: execution
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: { count: 3650, period: day }
            error_after: { count: 7300, period: day }
      - name: customer
      - name: account
      - name: security
      - name: advisor

  - name: raw
    description: >
      Native Snowflake RAW schema — landed CDC/file payloads, VARIANT, before
      any flattening. dbt reads POSITION_CDC directly here because the native
      pipeline doesn't (yet) flatten it into its own STG table.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'AETHER_TRADE') }}"
    schema: RAW
    tables:
      - name: position_cdc
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: { count: 3650, period: day }
            error_after: { count: 7300, period: day }
