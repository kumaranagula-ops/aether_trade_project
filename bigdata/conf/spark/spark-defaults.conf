spark.master                        yarn
spark.submit.deployMode             client
spark.driver.memory                 1g
spark.yarn.am.memory                512m
spark.executor.instances            2
spark.executor.cores                1
spark.executor.memory               768m
spark.sql.shuffle.partitions        8
# Same image on the NodeManager, so use its local jars instead of uploading them per job.
spark.yarn.jars                     local:/opt/spark/jars/*
spark.pyspark.python                /usr/bin/python3
# Hive Metastore as the catalog, tables stored in HDFS.
spark.sql.catalogImplementation     hive
spark.hadoop.hive.metastore.uris    thrift://hive-metastore:9083
spark.sql.warehouse.dir             hdfs://namenode:8020/user/hive/warehouse
# Iceberg: a second catalog named "lake", backed by the same Hive Metastore.
# Plain Hive/Parquet tables stay in the default catalog; Iceberg tables are lake.<db>.<table>.
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type         hive
spark.sql.catalog.lake.uri          thrift://hive-metastore:9083
spark.sql.catalog.lake.warehouse    hdfs://namenode:8020/user/hive/warehouse
