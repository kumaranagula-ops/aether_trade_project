x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/${AIRFLOW_POSTGRES_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  # dbt (invoked by BashOperator from the DAGs) reads these directly.
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER}
  SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
  SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags
  - ./dbt:/opt/airflow/dbt
  - airflow_logs:/opt/airflow/logs

services:
  # --- Front-office system of record. Snowflake is NOT this. ---
  oltp-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${OLTP_POSTGRES_DB}
      POSTGRES_USER: ${OLTP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OLTP_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - oltp_pg_data:/var/lib/postgresql/data
      - ./sql/oltp/01_oltp_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./docker/oltp-init/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./data:/seed-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_POSTGRES_USER} -d ${OLTP_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Airflow's own metadata DB. Deliberately separate from OLTP above. ---
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-image
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-image
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-image
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: scheduler

  # --- Ad-hoc dbt CLI: `docker compose run --rm dbt run`, `... dbt test` ---
  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
    volumes:
      - ./dbt/aether_trade:/usr/app/dbt
    profiles: ["tools"]  # only starts on `docker compose run`, never on `up`

volumes:
  oltp_pg_data:
  airflow_pg_data:
  airflow_logs:
